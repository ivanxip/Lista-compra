<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>La Compra</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#34c759" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icono.png" />
  <style>
    :root { --verde:#34c759; --gris:#8e8e93; --fondo:#f2f2f7; --borde:#d1d1d6; }
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body { font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
           background:var(--fondo); height:100dvh; display:flex; flex-direction:column; }
    header { padding:calc(env(safe-area-inset-top) + 14px) 16px 12px; background:var(--verde); color:#fff; }
    header .fila { display:flex; justify-content:space-between; align-items:baseline; }
    header h1 { font-size:22px; font-weight:700; }
    header .editar { background:none; border:none; color:#fff; font-size:15px; opacity:.9; padding:4px; }
    header p { font-size:12px; opacity:.85; margin-top:2px; }
    main { flex:1; overflow-y:auto; padding:12px; }
    #vacia { text-align:center; color:var(--gris); margin-top:60px; font-size:15px; display:none; }
    ul { list-style:none; }
    .item { display:flex; align-items:center; gap:12px; background:#fff; border-radius:14px;
            padding:12px 14px; margin-bottom:8px; box-shadow:0 1px 2px rgba(0,0,0,.04); }
    .check { width:28px; height:28px; min-width:28px; border-radius:50%; border:2px solid var(--borde);
             background:#fff; color:#fff; font-size:16px; font-weight:700; cursor:pointer; }
    .item.hecho .check { background:var(--verde); border-color:var(--verde); }
    .texto { flex:1; display:flex; flex-direction:column; }
    .nombre { font-size:17px; }
    .meta { font-size:12px; color:var(--gris); margin-top:1px; }
    .item.hecho .nombre { text-decoration:line-through; color:var(--gris); }
    .borrar { background:none; border:none; color:#ff3b30; font-size:17px; padding:8px; cursor:pointer; }
    #entrada { display:flex; gap:8px; padding:10px 12px calc(env(safe-area-inset-bottom) + 10px);
               background:rgba(242,242,247,.92); backdrop-filter:blur(10px); border-top:1px solid var(--borde); }
    #entrada input { flex:1; padding:14px; border-radius:12px; border:1px solid var(--borde); font-size:16px; background:#fff; }
    #entrada button { background:var(--verde); color:#fff; border:none; border-radius:12px;
                      padding:0 22px; font-size:16px; font-weight:600; cursor:pointer; }
    #overlay { position:fixed; inset:0; background:rgba(0,0,0,.45); display:none;
               align-items:center; justify-content:center; z-index:10; }
    #overlay .tarjeta { background:#fff; border-radius:16px; padding:24px; width:82%; max-width:320px; }
    #overlay h2 { font-size:18px; margin-bottom:8px; }
    #overlay p { font-size:14px; color:var(--gris); margin-bottom:14px; }
    #overlay input { width:100%; padding:13px; border-radius:10px; border:1px solid var(--borde); font-size:16px; margin-bottom:12px; }
    #overlay button { width:100%; background:var(--verde); color:#fff; border:none; border-radius:10px;
                      padding:13px; font-size:16px; font-weight:600; cursor:pointer; }
    #error { display:none; background:#ff3b30; color:#fff; padding:10px 14px; font-size:14px; text-align:center; }
  </style>
</head>
<body>
  <header>
    <div class="fila">
      <h1>🛒 La Compra</h1>
      <button id="editarNombre" class="editar">✎</button>
    </div>
    <p id="saludo"></p>
  </header>

  <div id="error">⚠️ Falta pegar tu configuración de Firebase en <b>firebase-config.js</b> (ver instrucciones).</div>

  <main>
    <div id="vacia">La lista está vacía.<br>Añadid vuestros primeros productos 👇</div>
    <ul id="lista"></ul>
  </main>

  <div id="entrada">
    <input id="campo" type="text" placeholder="Añadir producto…" autocomplete="off" enterkeyhint="add" />
    <button id="añadir">Añadir</button>
  </div>

  <div id="overlay">
    <div class="tarjeta">
      <h2>¿Cómo te llamas?</h2>
      <p>Así sabréis quién añadió cada cosa. Se guarda solo en tu teléfono.</p>
      <input id="nombre" type="text" placeholder="Tu nombre" autocomplete="off" />
      <button id="guardarNombre">Guardar</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, push, update, remove, onValue }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
    import { getAuth, signInAnonymously }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { firebaseConfig } from "./firebase-config.js";

    // --- Aviso si aún no has pegado tu configuración ---
    if (!firebaseConfig.apiKey || firebaseConfig.apiKey.includes("PEGAR")) {
      document.getElementById("error").style.display = "block";
    }

    // --- Identidad de la lista: ?lista=nombre en la URL (por defecto "casa") ---
    const listaId = (new URLSearchParams(location.search).get("lista") || "casa")
      .replace(/[^a-zA-Z0-9_-]/g, "");

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);
    const itemsRef = ref(db, "listas/" + listaId + "/items");

    // --- Nombre de usuario (solo en este teléfono) ---
    let miNombre = localStorage.getItem("miNombre") || "";
    let datos = {};

    const $ = id => document.getElementById(id);
    const $lista = $("lista"), $campo = $("campo"), $saludo = $("saludo");

    function actualizarSaludo(pendientes) {
      $saludo.textContent = "Lista «" + listaId + "» · Hola, " + miNombre + " · "
        + (pendientes > 0 ? pendientes + " por comprar" : "todo comprado 🎉");
    }

    // --- Pedir nombre la primera vez / al pulsar ✎ ---
    function pedirNombre() {
      $("nombre").value = miNombre;
      $("overlay").style.display = "flex";
      setTimeout(() => $("nombre").focus(), 100);
    }
    $("guardarNombre").onclick = () => {
      const n = $("nombre").value.trim();
      if (!n) return;
      miNombre = n;
      localStorage.setItem("miNombre", n);
      $("overlay").style.display = "none";
      pintar();
    };
    $("editarNombre").onclick = pedirNombre;

    // --- Añadir producto ---
    function añadir() {
      const nombre = $campo.value.trim();
      if (!nombre) return;
      push(itemsRef, { nombre: nombre, hecho: false, autor: miNombre, ts: Date.now() });
      $campo.value = "";
      $campo.focus();
    }
    $("añadir").onclick = añadir;
    $campo.addEventListener("keydown", e => { if (e.key === "Enter") añadir(); });

    // --- Tachar / borrar (un solo listener para toda la lista) ---
    $lista.addEventListener("click", e => {
      const li = e.target.closest("li");
      if (!li) return;
      const id = li.dataset.id;
      if (e.target.closest(".borrar")) {
        remove(ref(db, "listas/" + listaId + "/items/" + id));
        return;
      }
      const item = datos[id];
      if (item) update(ref(db, "listas/" + listaId + "/items/" + id), { hecho: !item.hecho });
    });

    // --- Pintar la lista cuando cambien los datos (en TUS dos teléfonos a la vez) ---
    function pintar() {
      const arr = Object.entries(datos).map(([id, v]) => ({ id, ...v }));
      const pend = arr.filter(i => !i.hecho).sort((a, b) => a.ts - b.ts);
      const hechos = arr.filter(i => i.hecho).sort((a, b) => b.ts - a.ts);

      $lista.innerHTML = "";
      for (const it of [...pend, ...hechos]) {
        const li = document.createElement("li");
        li.className = "item" + (it.hecho ? " hecho" : "");
        li.dataset.id = it.id;

        const check = document.createElement("button");
        check.className = "check";
        check.textContent = it.hecho ? "✓" : "";

        const div = document.createElement("div");
        div.className = "texto";
        const nombre = document.createElement("span");
        nombre.className = "nombre";
        nombre.textContent = it.nombre;
        const hora = new Date(it.ts).toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" });
        const meta = document.createElement("span");
        meta.className = "meta";
        meta.textContent = (it.autor ? it.autor + " · " : "") + hora;
        div.append(nombre, meta);

        const borrar = document.createElement("button");
        borrar.className = "borrar";
        borrar.textContent = "✕";

        li.append(check, div, borrar);
        $lista.appendChild(li);
      }

      $("vacia").style.display = arr.length ? "none" : "block";
      actualizarSaludo(pend.length);
    }

    // --- Arranque: entrar de forma anónima y escuchar cambios en tiempo real ---
    signInAnonymously(auth)
      .then(() => onValue(itemsRef, snap => { datos = snap.val() || {}; pintar(); }))
      .catch(err => {
        document.getElementById("error").style.display = "block";
        document.getElementById("error").textContent = "⚠️ Error de conexión: " + err.message;
      });

    if (!miNombre) pedirNombre();
  </script>
</body>
</html>
